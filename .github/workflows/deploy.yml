# Trap Speed deploys itself: GitHub builds, Netlify only receives the files.
#
# Netlify's own git builds are turned OFF for this site (stop_builds), because
# a Netlify build costs credits and this build is two seconds of `node build.js`
# with no dependencies. Actions minutes are free on a public repo, so the same
# work costs nothing here. The deploy message carries the commit SHA so the
# live deploy is still traceable back to a commit.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A Mixpanel project token is a write-only, client-side identifier: it is
      # served to every visitor inside analytics.js and cannot read anything
      # back. So it belongs in a repository VARIABLE, not a secret -- calling it
      # a secret would only hide it from the one place it is useful (the build
      # log) while it stays visible in the shipped file. Unset is fine: the
      # build says so and analytics.js no-ops.
      - name: Build
        env:
          MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}
        run: node build.js

      # --functions is required as well as --dir: with Netlify's own git builds
      # turned off, a --no-build deploy ships the publish directory and nothing
      # else, so without this flag the plate lookup simply would not exist in
      # production. The DVSA credentials are NOT set here -- they are runtime
      # site environment variables in Netlify. A GitHub secret would be wrong:
      # it exists at build time, and this function needs them per request.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@24 deploy \
            --prod --no-build --dir=public \
            --functions=netlify/functions \
            --message "$GITHUB_SHA"
